openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: portfolio
    description: Portfolio company operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /portfolio-companies:
    get:
      operationId: listPortfolioCompanies
      tags: [portfolio]
      summary: List portfolio companies
      description: Returns the portfolio companies ordered by sort order
      responses:
        "200":
          description: A list of portfolio companies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PortfolioCompany"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    PortfolioCompany:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        tagline:
          type: [string, "null"]
        category:
          type: [string, "null"]
        badge:
          type: [string, "null"]
        description:
          type: [string, "null"]
        features:
          type: array
          items:
            type: string
        link_url:
          type: [string, "null"]
        link_label:
          type: [string, "null"]
        status:
          type: [string, "null"]
        sort_order:
          type: [integer, "null"]
      required:
        - id
        - name
